# Ruff config for the stitch-totp service plugin.
# Mirrors the Stitch monorepo's lint rules so the plugin stays stylistically
# consistent with the core it plugs into.
line-length = 100
target-version = "py311"
# _vendor/ is vendored from the core SDK (autoreg/plugin/rpc.py) and
# regenerated by stitch_plugin_tools — never lint or hand-edit it.
extend-exclude = ["_vendor"]

[lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
# E501: line length handled by formatter
# B008: function calls in defaults (plugin uses none, keep parity with core)
ignore = ["E501", "B008"]
